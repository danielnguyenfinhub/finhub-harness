[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "master-finhub"
version = "0.1.0"
description = "Master FinHub harness: agent runtime, sandbox, orchestration and evals."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
anthropic = ["anthropic>=1.11,<2"]
dev = ["ruff", "black", "pytest", "mypy", "anthropic>=1.11,<2"]

[project.scripts]
master-finhub = "master_finhub.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/master_finhub"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["references"]

[tool.black]
line-length = 100
extend-exclude = "references/"

[tool.mypy]
strict = true
exclude = ["references/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
